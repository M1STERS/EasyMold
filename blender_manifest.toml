schema_version = "1.0.0"

id = "easymold"
version = "1.0.0"
name = "EasyMold"
tagline = "Molds for 3D printing: direct molds and silicone mother molds"
maintainer = "Eddy Moncada Garcia <eddymoncadagarcia@gmail.com>"
type = "add-on"
website = "https://github.com/M1STERS/EasyMold"
tags = ["Mesh", "Modeling", "Object", "Import-Export"]

# Tested on Blender 5.2. The shell mold uses the SDF grid Geometry Nodes (Mesh to SDF Grid / Grid to Mesh).
blender_version_min = "5.2.0"

license = ["SPDX:GPL-3.0-or-later"]
copyright = ["2026 Eddy Moncada Garcia"]

[permissions]
files = "Export the mold pieces as STL or 3MF files"

[build]
# Only the add-on goes into the package: no test scenes, tooling, docs or images.
paths_exclude_pattern = [
    "__pycache__/",
    "/.git/",
    "/.gitignore",
    "/.gitattributes",
    "/.claude/",
    "/.superpowers/",
    "/.github/",
    "/TestBlender/",
    "/docs/",
    "/tests/",
    "README.md",
    "*.blend",
    "*.blend1",
    "*.zip",
]
